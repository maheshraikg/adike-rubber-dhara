# Give a Google account the admin or partner role (Firebase custom claims) from the GitHub UI.
# Actions → "Adike – set user role" → Run workflow. Only people with write access can run it.
# The person must have signed in to the app/admin console with Google at least once.
name: Adike – set user role

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Google account email'
        required: true
      role:
        description: 'Role to set'
        type: choice
        options: [admin, partner, show, clear]
        default: admin
      source_id:
        description: 'Partner source id (only for role = partner), e.g. puttur_krishi_sangha'
        required: false

permissions:
  contents: read

jobs:
  set-role:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Set claim
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAIL: ${{ inputs.email }}
          ROLE: ${{ inputs.role }}
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          case "$ROLE" in
            admin)   python -m tools.set_claim --email "$EMAIL" --admin ;;
            partner) python -m tools.set_claim --email "$EMAIL" --partner --source-id "$SOURCE_ID" ;;
            show)    python -m tools.set_claim --email "$EMAIL" --show ;;
            clear)   python -m tools.set_claim --email "$EMAIL" --clear ;;
          esac
