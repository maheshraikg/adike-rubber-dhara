# Adike–Rubber Dhara: collect prices twice a day and publish static JSON to gh-pages.
# Free: GitHub Actions (unlimited minutes on public repos) + GitHub Pages.
name: Adike – collect prices

on:
  schedule:
    - cron: '0 6,12 * * *'   # 11:30 and 17:30 IST (GitHub may start a few minutes late)
  workflow_dispatch:
    inputs:
      evening:
        description: 'Evening run (writes the daily summary)?'
        type: choice
        options: [auto, 'yes', 'no']
        default: auto
  repository_dispatch:
    types: [adike-collect]

permissions:
  contents: write

concurrency:
  group: adike-gh-pages
  cancel-in-progress: false

env:
  APP_DIR: .   # app lives at the repo root
  DATA_BRANCH: gh-pages

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out ${{ env.DATA_BRANCH }} into site/
        env:
          TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" "$DATA_BRANCH" >/dev/null; then
            git clone --depth 1 --branch "$DATA_BRANCH" "$url" site
          else
            mkdir site && git -C site init -b "$DATA_BRANCH" && git -C site remote add origin "$url"
          fi
          touch site/.nojekyll
          cp -r "$APP_DIR/pages/." site/   # landing + privacy pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/pipeline/requirements.txt

      - name: Install pipeline
        run: pip install -r "$APP_DIR/pipeline/requirements.txt"

      - name: Run collection
        id: run
        working-directory: ${{ env.APP_DIR }}/pipeline
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python -m adike_pipeline.run --site "$GITHUB_WORKSPACE/site" --config ../data \
            --evening "${{ github.event.inputs.evening || 'auto' }}"

      - name: Commit and push data (only if changed)
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git -c user.name="adike-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3 4; do
            git push origin "HEAD:$DATA_BRANCH" && exit 0
            sleep $((2 ** i))
            git pull --rebase origin "$DATA_BRANCH" || true
          done
          exit 1
