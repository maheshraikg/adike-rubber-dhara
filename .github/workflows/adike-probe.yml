# Manually probe data sources (data.gov.in filter syntax, official page URLs, MET Norway).
# Copy the log output into ./docs/DATA_SOURCES.md.
name: Adike – probe sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          DATAGOV_RELAY_URL: ${{ vars.ADIKE_RELAY_URL }}
          DATAGOV_RELAY_TOKEN: ${{ secrets.ADIKE_RELAY_TOKEN }}
        run: python -m tools.probe_sources --config ../data
      - name: Discover price pages (follows price/rate links)
        run: python -m tools.discover_sources
      - name: Rubber Board parser (live)
        run: python -m tools.check_rubberboard
      - name: Agmarknet 2.0 report API (live)
        if: always()
        run: python -m tools.probe_agmarknet
